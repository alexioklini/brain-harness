- id: agent-default-model
  config:
    provider: brain
    model: !!js process.env.BRAIN_MODEL
- id: agent-preset-registry
  config:
    default: brain
- id: system-prompt
  config:
    personaPrefix: You are Brain. Follow the user's instructions and use the available central services.
    includeRuntimeContext: false
- insert:
    - id: llm-brain
      name: '@deepseek-ai/dsh-llm-brain'
      config:
        baseURL: https://llmrouter.alexklinsky.dev/v1
        credential: BRAIN_ROUTER_KEY
        timeoutMs: 300000
        maxResponseBytes: 16777216
    - id: preset-brain
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: brain
        name: Brain
        order: 1
        plugins: []
